# Optional Unraid override — copy to docker-compose.override.yml
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# Stores PostgreSQL data and uploaded documents on Unraid appdata for easier backup.
# Docker Compose merges this file automatically with docker-compose.yml.
#
# If you still have an `api:` section from the old stack, remove it.

services:
  db:
    volumes:
      - /mnt/user/appdata/receiptslegder/postgres:/var/lib/postgresql/data
  web:
    volumes:
      - /mnt/user/appdata/receiptslegder/documents:/app/data/documents
