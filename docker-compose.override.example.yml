# Optional Unraid override — copy to docker-compose.override.yml
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# Stores PostgreSQL data and receipt images on Unraid appdata for easier backup.
# Docker Compose merges this file automatically with docker-compose.yml.

services:
  db:
    volumes:
      - /mnt/user/appdata/receiptslegder/postgres:/var/lib/postgresql/data
  api:
    volumes:
      - /mnt/user/appdata/receiptslegder/receipts:/app/data/receipts
