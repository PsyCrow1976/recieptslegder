services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-receiptslegder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-receiptslegder}
      POSTGRES_DB: ${POSTGRES_DB:-receiptslegder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-receiptslegder} -d ${POSTGRES_DB:-receiptslegder}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8085}:8000"
    volumes:
      - documents:/app/data/documents
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://receiptslegder:receiptslegder@db:5432/receiptslegder}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      TZ: ${TZ:-Europe/Copenhagen}
      DOCUMENT_STORAGE_PATH: /app/data/documents
    depends_on:
      db:
        condition: service_healthy
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8085]/"
      net.unraid.docker.description: "Household ledger — people, bank and investment accounts, receipts"

volumes:
  postgres_data:
    driver: local
  documents:
    driver: local
